<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Tether</title>
    <meta name="description" content="A daily health self-check for long-duration spaceflight crews. Compares each indicator with your own preflight baseline, grounded in NASA GeneLab study GLDS-53." />
    <meta name="theme-color" content="#f3f5f9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0c1222" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta property="og:title" content="Tether" />
    <meta property="og:description" content="Notice when you drift from your own normal. A daily health self-check for long-duration crews." />
    <meta property="og:type" content="website" />
    <script>
      try {
        var t = localStorage.getItem('tether.theme')
        if (t) document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Tether needs JavaScript to run.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
